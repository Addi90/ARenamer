name: Release (bump + tag on master)

# Cuts a release when a release/* PR is merged into master:
#   1. `do bump` — decides the semver bump from the conventional commits since
#      the last tag, updates pyproject.toml + frontend/package.json, prepends
#      changelog.md and commits `chore(release): vX`.
#   2. `do tag` — tags that commit as v<version> (master-only, enforced by `do`).
#   3. Pushes the commit + tag -> triggers build.yml, which produces the
#      per-OS desktop builds and the GitHub Release.
#
# Only merged PRs from release/* branches trigger this (see the `if:` below),
# so commits landing on master by other means never accidentally cut a release.
#
# If `do bump` finds no commits since the last tag it exits without committing,
# and the tag step is skipped — the workflow is idempotent.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  bump-and-tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'release/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          # Checkout master directly so `do bump` and `do tag` operate
          # on the actual release branch context.
          ref: master

          # Full history + tags are required because `do bump` uses
          # `git describe --tags` and `git log <tag>..HEAD`.
          fetch-depth: 0

          # A PAT/App token is preferred here if:
          #   - master is protected, or
          #   - the resulting push must trigger downstream workflows
          #     such as build.yml.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # `do` imports tomllib, which requires Python >= 3.11.
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version + write changelog (do bump)
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          before="$(git rev-parse HEAD)"

          python do bump

          after="$(git rev-parse HEAD)"

          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

          if [ "$before" != "$after" ]; then
            echo "Release commit created:"
            git log --oneline "$before..$after"
          else
            echo "No release commit was created - skipping tag."
          fi

      - name: Tag the release (do tag)
        if: steps.bump.outputs.before != steps.bump.outputs.after
        shell: bash
        run: |
          set -euo pipefail

          python do tag

      - name: Push release commit and tag
        if: steps.bump.outputs.before != steps.bump.outputs.after
        shell: bash
        run: |
          set -euo pipefail

          git push origin master --tags